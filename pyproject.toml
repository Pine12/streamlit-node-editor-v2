[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-node-editor-v2"
version = "0.0.1"
description = "A ComfyUI / Unreal Blueprints-style node graph editor for Streamlit — build visual AI pipelines in pure Python. Forked from RhythrosaLabs/streamlit-node-editor by Dan S"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Graham Elliott", email = "grhmelliott@gmail.com" }]
dependencies = ["streamlit >= 1.51"]

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest==7.4.0",
  "playwright==1.48.0",
  "requests==2.31.0",
  "pytest-playwright-snapshot==1.0",
  "pytest-rerunfailures==12.0",
]

[tool.setuptools.packages.find]
include = ["streamlit_node_editor_v2*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
streamlit_node_editor_v2 = ["frontend/build/**/*", "pyproject.toml"]

[[tool.streamlit.component.components]]
name = "st_node_editor"
asset_dir = "frontend/build"
